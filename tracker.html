<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Tasks Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-50 min-h-screen w-full m-0 p-0 font-sans text-slate-800 flex flex-col">

  <!-- Full-Screen App Mount -->
  <div id="task-tracker-app" class="w-full min-h-screen flex flex-col flex-grow"></div>

  <script>
    class DailyTaskTracker {
      constructor(
        tasks = {
          Basic: [
            { name: 'Exercises', objective: 'healthy' },
            { name: 'Reading', type: 'weekly', desc: 'Read at least 1 chapter of a book', objective: 'useful' },
            { name: 'Learn an expression', objective: 'useful' },
            { name: 'Diet', disabled: true, desc: 'Focus on this later', objective: 'healthy' }
          ],
          Music: [
            { name: 'Learn songs', objective: 'fun' },
            { name: 'Practice singing', objective: 'fun' }
          ]
        },
        title = 'Tasks Tracker',
        options = {}
      ) {
        this.id = options.id || Math.random().toString(36).substring(2, 9);
        this.title = title;
        this.tasks = tasks;
        this.storageKey = options.storageKey || 'daily_tasks_status';
        this.mountSelector = options.mountSelector || '#task-tracker-app';

        // Objective styles: Explicit border color when unchecked, filled background when checked
        this.objectiveColors = {
          healthy: {
            border: 'border-emerald-500',
            bg: 'peer-checked:bg-emerald-600',
            badge: 'text-emerald-700 bg-emerald-50 border border-emerald-200'
          },
          useful: {
            border: 'border-sky-500',
            bg: 'peer-checked:bg-sky-600',
            badge: 'text-sky-700 bg-sky-50 border border-sky-200'
          },
          fun: {
            border: 'border-amber-400',
            bg: 'peer-checked:bg-amber-500',
            badge: 'text-amber-700 bg-amber-50 border border-amber-200'
          },
          default: {
            border: 'border-slate-300',
            bg: 'peer-checked:bg-slate-600',
            badge: 'text-slate-700 bg-slate-50 border border-slate-200'
          }
        };

        this.root = document.querySelector(this.mountSelector) || document.body;

        // Render UI and bind tasks functionality full screen
        this.createUI();
        this.loadState();
        this.attachEvents();
      }

      createUI() {
        this.wrapper = document.createElement('div');
        this.wrapper.id = this.id;
        this.wrapper.className = 'w-full min-h-screen flex flex-col bg-slate-50';

        // Full-width top header bar
        const header = document.createElement('header');
        header.className = 'w-full bg-slate-900 text-white px-6 sm:px-10 py-5 flex flex-wrap justify-between items-center gap-4 shadow-md sticky top-0 z-10';

        const todayFormatted = new Date().toLocaleDateString(undefined, {
          weekday: 'long',
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });

        header.innerHTML = `
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
              <i class="fa-solid fa-list-check text-xl"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold tracking-tight">${this.title}</h1>
              <p class="text-xs text-slate-400 mt-0.5">${todayFormatted}</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div id="progress-badge-${this.id}" class="text-xs sm:text-sm font-semibold px-4 py-2 rounded-full bg-slate-800 text-emerald-400 border border-slate-700">
              0 / 0 Completed
            </div>
          </div>
        `;

        // Full-width main workspace
        const main = document.createElement('main');
        main.className = 'w-full flex-grow px-6 sm:px-10 py-8';

        const containerDiv = document.createElement('div');
        containerDiv.className = 'w-full max-w-4xl mx-auto space-y-6';

        let taskIndex = 0;
        Object.entries(this.tasks).forEach(([section, taskList]) => {
          const sectionCard = document.createElement('section');
          sectionCard.className = 'w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-6';

          const sectionHeader = document.createElement('div');
          sectionHeader.className = 'flex items-center justify-between border-b border-slate-100 pb-3 mb-4';

          const sectionTitle = document.createElement('h2');
          sectionTitle.className = 'text-xs font-bold uppercase tracking-wider text-slate-500';
          sectionTitle.textContent = section;

          const sectionCount = document.createElement('span');
          sectionCount.className = 'text-xs font-medium text-slate-400';
          sectionCount.textContent = `${taskList.length} ${taskList.length === 1 ? 'task' : 'tasks'}`;

          sectionHeader.appendChild(sectionTitle);
          sectionHeader.appendChild(sectionCount);

          const ul = document.createElement('ul');
          ul.className = 'space-y-3';

          taskList.forEach((taskItem) => {
            const isObj = typeof taskItem === 'object' && taskItem !== null;
            const taskName = isObj ? taskItem.name : taskItem;
            const taskType = isObj ? (taskItem.type || 'daily') : 'daily';
            const taskDesc = isObj && taskItem.desc ? taskItem.desc : '';
            const isDisabled = isObj && !!taskItem.disabled;

            const objectiveKey = isObj && taskItem.objective ? taskItem.objective : 'default';
            const colors = this.objectiveColors[objectiveKey] || this.objectiveColors.default;

            const id = `task-${this.id}-${taskIndex++}`;
            const li = document.createElement('li');

            li.className = `flex items-start justify-between p-4 rounded-xl border transition ${
              isDisabled
                ? 'opacity-50 bg-slate-50 border-slate-100 cursor-not-allowed'
                : 'bg-white border-slate-200/80 hover:border-slate-300 hover:bg-slate-50 cursor-pointer'
            }`;

            li.innerHTML = `
              <div class="flex items-start gap-3.5 w-full">
                <label for="${id}" class="relative flex items-start gap-3.5 w-full ${isDisabled ? 'cursor-not-allowed' : 'cursor-pointer'}">
                  <input type="checkbox" id="${id}" data-task="${taskName}" data-type="${taskType}" ${
                    isDisabled ? 'disabled' : ''
                  } class="sr-only peer">
                  
                  <!-- Custom colored checkbox box -->
                  <div class="mt-0.5 w-5 h-5 rounded-md border-2 ${colors.border} bg-white ${colors.bg} peer-checked:border-transparent flex items-center justify-center transition flex-shrink-0 ${isDisabled ? 'opacity-50' : ''}">
                    <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                  </div>

                  <div class="flex flex-col flex-grow min-w-0">
                    <span class="text-sm sm:text-base font-medium select-none flex items-center flex-wrap gap-2 ${
                      isDisabled ? 'text-slate-400 line-through' : 'text-slate-800'
                    }">
                      <span class="break-words">${taskName}</span>
                      ${taskType === 'weekly' ? `<span class="text-[10px] px-2 py-0.5 rounded-md no-underline font-semibold ${colors.badge}">Weekly</span>` : ''}
                      ${isDisabled ? '<span class="text-[10px] text-slate-500 bg-slate-200 px-2 py-0.5 rounded-md no-underline font-normal">Disabled</span>' : ''}
                    </span>
                    ${taskDesc ? `<span class="text-xs sm:text-sm text-slate-500 mt-1 break-words">${taskDesc}</span>` : ''}
                  </div>
                </label>
              </div>
            `;

            const checkbox = li.querySelector('input[type="checkbox"]');
            const checkIcon = li.querySelector('svg');
            checkbox.addEventListener('change', () => {
              checkIcon.classList.toggle('opacity-0', !checkbox.checked);
              checkIcon.classList.toggle('opacity-100', checkbox.checked);
            });

            ul.appendChild(li);
          });

          sectionCard.appendChild(sectionHeader);
          sectionCard.appendChild(ul);
          containerDiv.appendChild(sectionCard);
        });

        main.appendChild(containerDiv);
        this.wrapper.appendChild(header);
        this.wrapper.appendChild(main);
        this.root.appendChild(this.wrapper);
      }

      updateProgress() {
        const checkboxes = Array.from(this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])'));
        const completed = checkboxes.filter((chk) => chk.checked).length;
        const badge = document.getElementById(`progress-badge-${this.id}`);
        if (badge) {
          badge.textContent = `${completed} / ${checkboxes.length} Completed`;
        }
      }

      attachEvents() {
        const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
        checkboxes.forEach((chk) => {
          chk.addEventListener('change', () => {
            this.saveState();
            this.updateProgress();
          });
        });
        this.updateProgress();
      }

      getTodayDateString() {
        const today = new Date();
        return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
      }

      getWeekKey() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        const yearStart = new Date(d.getFullYear(), 0, 1);
        const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        return `${d.getFullYear()}-W${weekNo}`;
      }

      saveState() {
        const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');

        let existingData = {};
        const storedValue = localStorage.getItem(this.storageKey);
        if (storedValue) {
          try {
            existingData = JSON.parse(storedValue);
          } catch (e) {}
        }

        const dailyTasks = existingData.dailyTasks || {};
        const weeklyTasks = existingData.weeklyTasks || {};

        const currentDailyDate = this.getTodayDateString();
        const currentWeekKey = this.getWeekKey();

        const savedDailyDate = existingData.dailyDate;
        const savedWeekKey = existingData.weekKey;

        const activeDaily = savedDailyDate === currentDailyDate ? dailyTasks : {};
        const activeWeekly = savedWeekKey === currentWeekKey ? weeklyTasks : {};

        checkboxes.forEach((chk) => {
          const taskName = chk.dataset.task;
          const taskType = chk.dataset.type;

          if (taskType === 'weekly') {
            activeWeekly[taskName] = chk.checked;
          } else {
            activeDaily[taskName] = chk.checked;
          }
        });

        const data = {
          dailyDate: currentDailyDate,
          weekKey: currentWeekKey,
          dailyTasks: activeDaily,
          weeklyTasks: activeWeekly
        };

        localStorage.setItem(this.storageKey, JSON.stringify(data));
      }

      loadState() {
        const storedValue = localStorage.getItem(this.storageKey);
        if (!storedValue) return;

        try {
          const data = JSON.parse(storedValue);
          const today = this.getTodayDateString();
          const currentWeek = this.getWeekKey();

          const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
          checkboxes.forEach((chk) => {
            const taskName = chk.dataset.task;
            const taskType = chk.dataset.type;
            const checkIcon = chk.parentElement.querySelector('svg');

            if (taskType === 'weekly') {
              if (data.weekKey === currentWeek && data.weeklyTasks && data.weeklyTasks[taskName]) {
                chk.checked = true;
              }
            } else {
              if (data.dailyDate === today && data.dailyTasks && data.dailyTasks[taskName]) {
                chk.checked = true;
              }
            }

            if (chk.checked && checkIcon) {
              checkIcon.classList.remove('opacity-0');
              checkIcon.classList.add('opacity-100');
            }
          });
        } catch (e) {
          console.error('Failed to parse task localStorage state:', e);
        }
      }
    }

    // Instantiation:
    new DailyTaskTracker({
      Foundation: [
        { name: 'Exercises', type: 'daily', objective: 'healthy' },
        { name: 'Learn songs', type: 'daily', objective: 'useful' }
      ],
      Music: [
        { name: 'Reading', type: 'daily', desc: "Try to understand how girls, social, the world work", objective: 'yellow' },
        { name: 'Practice singing', type: 'daily', objective: 'useful' },
        { name: 'Write/sing songs', type: 'daily', desc: "Enjoy life", objective: 'useful' },
        { name: 'Social', objective: 'fun' }
      ]
    });
  </script>
</body>
</html>
