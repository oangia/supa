<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Storage File Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .thumb {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .thumb-video {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      background: #0f172a;
      flex-shrink: 0;
    }
    #editTextarea {
      width: 100%;
      min-height: 55vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      resize: vertical;
      background: white;
      outline: none;
    }
    #editTextarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans antialiased overflow-hidden">

  <!-- Toast -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md shadow-indigo-200">
        <i class="fa-solid fa-cloud text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-slate-900 text-base leading-tight">Supabase Storage Explorer</h1>
        <p class="text-xs text-slate-500 font-mono mt-0.5" id="headerUrl">Not connected</p>
      </div>
    </div>

    <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-lg border border-slate-200">
      <button onclick="switchTab('explorer')" id="navExplorerTab" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm text-slate-800 transition">Explorer</button>
      <button onclick="switchTab('settings')" id="navSettingsTab" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition">Settings</button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 overflow-hidden flex flex-col p-6 max-w-7xl w-full mx-auto">

    <!-- Explorer View -->
    <div id="viewExplorer" class="flex-1 flex flex-col overflow-hidden bg-white rounded-2xl border border-slate-200 shadow-xs">

      <!-- Toolbar -->
      <div class="p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4 bg-slate-50/50 rounded-t-2xl">
        <div class="flex items-center space-x-2 text-sm">
          <button onclick="jumpToBreadcrumb(0)" class="text-slate-600 hover:text-indigo-600 font-semibold flex items-center">
            <i class="fa-solid fa-house mr-1 text-xs"></i> Root
          </button>
          <span class="text-slate-300">/</span>
          <nav id="breadcrumbNav" class="flex items-center space-x-2"></nav>
        </div>

        <div class="flex items-center space-x-3">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
              <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search files..." 
                   class="pl-9 pr-4 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 w-48 sm:w-64 transition">
          </div>

          <button onclick="openCreateFolderModal()" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-lg shadow-2xs flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-folder-plus text-amber-500"></i>
            <span>New Folder</span>
          </button>

          <button onclick="createBackup()" id="backupBtn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow-sm shadow-emerald-200 flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-box-archive"></i>
            <span>Backup</span>
          </button>

          <div class="relative">
            <button onclick="toggleUploadMenu()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm shadow-indigo-200 flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-upload"></i>
              <span>Upload</span>
              <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
            </button>
            
            <div id="uploadMenu" class="hidden absolute right-0 mt-1 w-48 bg-white rounded-xl shadow-xl border border-slate-200 py-1 z-30">
              <label class="flex items-center px-4 py-2 text-xs text-slate-700 hover:bg-slate-50 cursor-pointer">
                <i class="fa-solid fa-file mr-2.5 text-indigo-500"></i>
                <span>Upload File(s)</span>
                <input type="file" id="localFileUpload" multiple onchange="handleFileUpload(event, false)" class="hidden">
              </label>
              <label class="flex items-center px-4 py-2 text-xs text-slate-700 hover:bg-slate-50 cursor-pointer">
                <i class="fa-solid fa-folder-open mr-2.5 text-amber-500"></i>
                <span>Upload Folder</span>
                <input type="file" id="localFolderUpload" webkitdirectory directory multiple onchange="handleFileUpload(event, true)" class="hidden">
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="flex-1 overflow-y-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider font-semibold border-b border-slate-200 sticky top-0 z-10">
            <tr>
              <th class="py-3 px-4">Name</th>
              <th class="py-3 px-4">Type</th>
              <th class="py-3 px-4">Size</th>
              <th class="py-3 px-4">Updated</th>
              <th class="py-3 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="itemsTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <!-- Footer -->
      <div class="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500 rounded-b-2xl">
        <div id="connectionStatus" class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="statusDot"></span>
          <span id="statusText">Not connected</span>
        </div>
        <div id="itemCountLabel">0 item(s)</div>
      </div>
    </div>

    <!-- Settings View -->
    <div id="viewSettings" class="hidden flex-1 flex flex-col overflow-y-auto bg-white rounded-2xl border border-slate-200 shadow-xs p-6 space-y-6">
      <div>
        <h2 class="text-lg font-bold text-slate-900 mb-1">Configuration</h2>
        <p class="text-xs text-slate-500">Enter your Supabase credentials and Storage bucket name.</p>
      </div>

      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4 max-w-xl">
        <h3 class="font-semibold text-slate-800 text-sm">Supabase Credentials</h3>
        
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Project URL</label>
          <input type="text" id="settingUrlInput" placeholder="https://xxxxx.supabase.co" 
                 class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Anon Public Key</label>
          <input type="password" id="settingApiKeyInput" placeholder="eyJhbGciOiJIUzI1NiIsIn..." 
                 class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Storage Bucket Name</label>
          <input type="text" id="settingBucketInput" placeholder="files" value="files"
                 class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>

        <button onclick="saveSettings()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">
          Save & Connect
        </button>
      </div>
    </div>
  </main>

  <!-- Create Folder Modal -->
  <div id="modalCreateFolder" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-200">
      <h3 class="font-bold text-slate-900 text-base">Create New Folder</h3>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Folder Name</label>
        <input type="text" id="folderNameInput" placeholder="e.g. documents" 
               class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModals()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-lg transition">Cancel</button>
        <button onclick="submitCreateFolder()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">Create Folder</button>
      </div>
    </div>
  </div>

  <!-- Preview / Editor Modal -->
  <div id="modalPreview" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col border border-slate-200 overflow-hidden">
      <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 bg-slate-50">
        <h3 id="previewTitle" class="font-bold text-slate-900 text-sm truncate"></h3>
        <button onclick="closeModals()" class="text-slate-500 hover:text-slate-800 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="previewBody" class="flex-1 overflow-auto p-6 flex items-center justify-center bg-slate-100 min-h-[300px]"></div>
      <div class="px-5 py-3 border-t border-slate-200 bg-white flex justify-end gap-2 flex-wrap">
        <button id="previewSaveBtn" onclick="saveEditedText()" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg">
          <i class="fa-solid fa-floppy-disk mr-1"></i> Save
        </button>
        <button id="previewCancelEditBtn" onclick="cancelEditText()" class="hidden px-4 py-2 bg-slate-500 hover:bg-slate-600 text-white text-xs font-semibold rounded-lg">
          Cancel
        </button>
        <a id="previewDownloadBtn" href="#" download class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg">
          <i class="fa-solid fa-download mr-1"></i> Download
        </a>
        <button onclick="closeModals()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg">Close</button>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let currentBucket = 'files';
    let currentPath = '';
    let folderHistory = [{ path: '', name: 'Root' }];
    let allItems = [];
    let filteredItems = [];

    // Editor state
    let currentPreviewPath = null;
    let currentPreviewName = null;
    let currentPreviewText = null;
    let isTextEditor = false;

    // ---------- Init ----------
    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('sb_url');
      const savedKey = localStorage.getItem('sb_key');
      const savedBucket = localStorage.getItem('sb_bucket') || 'files';

      if (savedUrl) document.getElementById('settingUrlInput').value = savedUrl;
      if (savedKey) document.getElementById('settingApiKeyInput').value = savedKey;
      document.getElementById('settingBucketInput').value = savedBucket;

      if (savedUrl && savedKey) {
        initSupabase(savedUrl, savedKey, savedBucket);
      } else {
        updateConnectionStatus(false, 'Please configure credentials in Settings');
        switchTab('settings');
      }
    });

    function saveSettings() {
      const url = document.getElementById('settingUrlInput').value.trim();
      const key = document.getElementById('settingApiKeyInput').value.trim();
      const bucket = document.getElementById('settingBucketInput').value.trim() || 'files';

      if (!url || !key) {
        showToast('URL and Anon Key are required', 'warning');
        return;
      }

      localStorage.setItem('sb_url', url);
      localStorage.setItem('sb_key', key);
      localStorage.setItem('sb_bucket', bucket);

      initSupabase(url, key, bucket);
      switchTab('explorer');
    }

    function initSupabase(url, key, bucket) {
      try {
        supabaseClient = window.supabase.createClient(url, key);
        currentBucket = bucket;
        document.getElementById('headerUrl').textContent = url + '  •  bucket: ' + bucket;
        currentPath = '';
        folderHistory = [{ path: '', name: 'Root' }];
        listFiles();
      } catch (err) {
        console.error(err);
        showToast('Failed to initialize Supabase client', 'error');
      }
    }

    // ---------- List files ----------
    async function listFiles() {
      if (!supabaseClient) return;

      updateConnectionStatus(null, 'Loading...');
      try {
        const { data, error } = await supabaseClient
          .storage
          .from(currentBucket)
          .list(currentPath, {
            limit: 500,
            offset: 0,
            sortBy: { column: 'name', order: 'asc' }
          });

        if (error) throw error;

        allItems = (data || []).filter(item => item.name !== '.emptyFolderPlaceholder');

        await Promise.all(allItems.map(async (item) => {
          const isFolder = !item.id;
          if (isFolder) return;

          const fullPath = currentPath ? `${currentPath}/${item.name}` : item.name;
          item.fullPath = fullPath;

          if (isImage(item.name) || isVideo(item.name)) {
            try {
              const { data: signed, error: signErr } = await supabaseClient
                .storage
                .from(currentBucket)
                .createSignedUrl(fullPath, 3600);

              if (!signErr && signed?.signedUrl) {
                item.thumbUrl = signed.signedUrl;
              }
            } catch (e) {}
          }
        }));

        updateConnectionStatus(true, `Connected • Bucket: ${currentBucket}`);
        renderView();
      } catch (err) {
        console.error(err);
        updateConnectionStatus(false, err.message || 'Failed to list files');
        showToast(err.message || 'Failed to list files', 'error');
      }
    }

    // ---------- Render ----------
    function renderView() {
      renderBreadcrumbs();

      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      filteredItems = searchVal
        ? allItems.filter(i => i.name.toLowerCase().includes(searchVal))
        : [...allItems];

      filteredItems.sort((a, b) => {
        const aFolder = !a.id;
        const bFolder = !b.id;
        if (aFolder !== bFolder) return aFolder ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      const tbody = document.getElementById('itemsTableBody');
      tbody.innerHTML = '';
      document.getElementById('itemCountLabel').textContent = `${filteredItems.length} item(s)`;

      if (filteredItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-slate-400">
          <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>This folder is empty
        </td></tr>`;
        return;
      }

      filteredItems.forEach(item => {
        const isFolder = !item.id;
        const fullPath = item.fullPath || (currentPath ? `${currentPath}/${item.name}` : item.name);

        const row = document.createElement('tr');
        row.className = "hover:bg-slate-50/80 transition text-slate-700 border-b border-slate-100 last:border-none";

        let mediaPreview = '';
        if (isFolder) {
          mediaPreview = `<div class="w-9 h-9 flex items-center justify-center rounded-md bg-amber-50 text-amber-500"><i class="fa-solid fa-folder text-lg"></i></div>`;
        } else if (item.thumbUrl && isImage(item.name)) {
          mediaPreview = `<img src="${item.thumbUrl}" class="thumb" alt="" loading="lazy" onerror="this.style.display='none'">`;
        } else if (item.thumbUrl && isVideo(item.name)) {
          mediaPreview = `<video class="thumb-video" muted preload="metadata" src="${item.thumbUrl}#t=0.5"></video>`;
        } else {
          mediaPreview = `<div class="w-9 h-9 flex items-center justify-center rounded-md bg-slate-100 text-slate-500">${getFileIcon(item.name)}</div>`;
        }

        const sizeStr = isFolder ? '--' : formatBytes(item.metadata?.size || 0);
        const updated = item.updated_at ? new Date(item.updated_at).toLocaleDateString() : '--';

        const clickAction = isFolder
          ? `navigateToFolder('${escapeHtml(fullPath)}', '${escapeHtml(item.name)}')`
          : `openPreview('${escapeHtml(fullPath)}', '${escapeHtml(item.name)}')`;

        row.innerHTML = `
          <td class="py-2.5 px-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="${clickAction}">
              ${mediaPreview}
              <span class="font-medium hover:text-indigo-600 truncate max-w-xs">${escapeHtml(item.name)}</span>
            </div>
          </td>
          <td class="py-2.5 px-4 text-slate-500">${isFolder ? 'Folder' : getExtension(item.name)}</td>
          <td class="py-2.5 px-4 text-slate-500 font-mono">${sizeStr}</td>
          <td class="py-2.5 px-4 text-slate-500 font-mono">${updated}</td>
          <td class="py-2.5 px-4 text-right space-x-1">
            ${!isFolder ? `
              <button onclick="openPreview('${escapeHtml(fullPath)}', '${escapeHtml(item.name)}')" title="Open" class="p-1.5 hover:text-indigo-600 rounded hover:bg-slate-100">
                <i class="fa-solid fa-eye"></i>
              </button>
              <button onclick="downloadFile('${escapeHtml(fullPath)}', '${escapeHtml(item.name)}')" title="Download" class="p-1.5 hover:text-emerald-600 rounded hover:bg-slate-100">
                <i class="fa-solid fa-download"></i>
              </button>
            ` : ''}
            <button onclick="deleteItem('${escapeHtml(fullPath)}', ${isFolder})" title="Delete" class="p-1.5 hover:text-rose-600 rounded hover:bg-slate-100">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function renderBreadcrumbs() {
      const nav = document.getElementById('breadcrumbNav');
      nav.innerHTML = '';
      folderHistory.forEach((crumb, idx) => {
        const isLast = idx === folderHistory.length - 1;
        const btn = document.createElement('button');
        btn.className = isLast ? "font-bold text-indigo-600" : "hover:text-slate-900";
        btn.textContent = crumb.name;
        btn.onclick = () => jumpToBreadcrumb(idx);
        nav.appendChild(btn);
        if (!isLast) {
          const sep = document.createElement('span');
          sep.className = "text-slate-300 mx-1";
          sep.textContent = '/';
          nav.appendChild(sep);
        }
      });
    }

    function handleSearch() {
      renderView();
    }

    // ---------- Navigation ----------
    function navigateToFolder(path, name) {
      currentPath = path;
      folderHistory.push({ path, name });
      listFiles();
    }

    function jumpToBreadcrumb(index) {
      folderHistory = folderHistory.slice(0, index + 1);
      currentPath = folderHistory[folderHistory.length - 1].path;
      listFiles();
    }

    // ---------- Create Folder ----------
    function openCreateFolderModal() {
      document.getElementById('folderNameInput').value = '';
      document.getElementById('modalCreateFolder').classList.remove('hidden');
    }

    async function submitCreateFolder() {
      const name = document.getElementById('folderNameInput').value.trim();
      if (!name) return;

      const folderPath = currentPath ? `${currentPath}/${name}/.emptyFolderPlaceholder` : `${name}/.emptyFolderPlaceholder`;

      try {
        const { error } = await supabaseClient
          .storage
          .from(currentBucket)
          .upload(folderPath, new Blob(['']), { upsert: false });

        if (error) throw error;

        closeModals();
        showToast(`Folder "${name}" created`, 'success');
        listFiles();
      } catch (err) {
        showToast(err.message || 'Failed to create folder', 'error');
      }
    }

    // ---------- Upload ----------
    function toggleUploadMenu() {
      document.getElementById('uploadMenu').classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('uploadMenu');
      if (!menu) return;
      if (!menu.contains(e.target) && !e.target.closest('button')?.getAttribute('onclick')?.includes('toggleUploadMenu')) {
        menu.classList.add('hidden');
      }
    });

    async function handleFileUpload(event, isFolderUpload = false) {
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;

      document.getElementById('uploadMenu')?.classList.add('hidden');
      showToast(`Uploading ${files.length} item(s) sequentially...`, 'info', 2500);

      let success = 0;
      let failed = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
          let targetPath = currentPath ? `${currentPath}/` : '';

          if (isFolderUpload && file.webkitRelativePath) {
            targetPath += file.webkitRelativePath;
          } else {
            targetPath += file.name;
          }

          const { error } = await supabaseClient
            .storage
            .from(currentBucket)
            .upload(targetPath, file, {
              cacheControl: '3600',
              upsert: true
            });

          if (error) throw error;
          success++;

          if ((i + 1) % 5 === 0 || i === files.length - 1) {
            showToast(`Uploaded ${i + 1} / ${files.length}`, 'info', 1200);
          }
        } catch (err) {
          console.error(err);
          failed++;
          showToast(`Failed: ${file.name}`, 'error', 2500);
        }
      }

      await listFiles();

      if (failed === 0) {
        showToast(`Successfully uploaded ${success} item(s)`, 'success');
      } else {
        showToast(`Uploaded ${success}, failed ${failed}`, 'warning');
      }

      event.target.value = '';
    }

    // ---------- Preview / Text Editor (with cache busting) ----------
    async function openPreview(path, name) {
      const title = document.getElementById('previewTitle');
      const body = document.getElementById('previewBody');
      const downloadBtn = document.getElementById('previewDownloadBtn');
      const saveBtn = document.getElementById('previewSaveBtn');
      const cancelBtn = document.getElementById('previewCancelEditBtn');

      currentPreviewPath = path;
      currentPreviewName = name;
      currentPreviewText = null;
      isTextEditor = false;
      saveBtn.classList.add('hidden');
      cancelBtn.classList.add('hidden');

      title.textContent = name;
      body.innerHTML = '<div class="text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>';

      try {
        const { data, error } = await supabaseClient
          .storage
          .from(currentBucket)
          .createSignedUrl(path, 3600);

        if (error) throw error;

        const url = data.signedUrl;
        downloadBtn.href = url;
        downloadBtn.download = name;

        if (isImage(name)) {
          body.innerHTML = `<img src="${url}" alt="${escapeHtml(name)}" class="max-w-full max-h-[70vh] rounded-lg shadow-md object-contain">`;
        } else if (isAudio(name)) {
          body.innerHTML = `
            <div class="w-full max-w-lg">
              <audio controls class="w-full" src="${url}"></audio>
              <p class="text-center text-xs text-slate-500 mt-3">${escapeHtml(name)}</p>
            </div>`;
        } else if (isVideo(name)) {
          body.innerHTML = `<video controls class="max-w-full max-h-[70vh] rounded-lg shadow-md" src="${url}"></video>`;
        } else if (isText(name)) {
          // Force fresh content (no cache)
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error('Failed to fetch file content');
          const text = await res.text();
          currentPreviewText = text;
          isTextEditor = true;

          body.innerHTML = `<textarea id="editTextarea">${escapeHtml(text)}</textarea>`;
          saveBtn.classList.remove('hidden');
          cancelBtn.classList.remove('hidden');
        } else {
          body.innerHTML = `
            <div class="text-center space-y-4">
              <i class="fa-solid fa-file text-5xl text-slate-400"></i>
              <p class="text-sm text-slate-600">Preview not available for this file type.</p>
            </div>`;
        }

        document.getElementById('modalPreview').classList.remove('hidden');
      } catch (err) {
        showToast(err.message || 'Failed to load file', 'error');
      }
    }

    function cancelEditText() {
      if (!isTextEditor || currentPreviewText === null) return;
      const textarea = document.getElementById('editTextarea');
      if (textarea) {
        textarea.value = currentPreviewText;
      }
      showToast('Changes discarded', 'info', 1500);
    }

    async function saveEditedText() {
      const textarea = document.getElementById('editTextarea');
      if (!textarea || !currentPreviewPath || !isTextEditor) return;

      const newContent = textarea.value;
      try {
        showToast('Saving...', 'info', 1500);
        const blob = new Blob([newContent], { type: 'text/plain;charset=utf-8' });
        const { error } = await supabaseClient
          .storage
          .from(currentBucket)
          .upload(currentPreviewPath, blob, {
            cacheControl: 'no-cache',
            upsert: true,
            contentType: 'text/plain'
          });

        if (error) throw error;

        currentPreviewText = newContent;
        showToast('File saved successfully', 'success');
        listFiles();
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Failed to save file', 'error');
      }
    }

    async function downloadFile(path, name) {
      try {
        const { data, error } = await supabaseClient
          .storage
          .from(currentBucket)
          .createSignedUrl(path, 60);

        if (error) throw error;

        // Force fresh download
        const res = await fetch(data.signedUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error('Download failed');
        const blob = await res.blob();

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (err) {
        showToast(err.message || 'Download failed', 'error');
      }
    }

    // ---------- Backup (fresh downloads + content hash) ----------
    async function createBackup() {
      if (!supabaseClient) {
        showToast('Not connected', 'warning');
        return;
      }

      const btn = document.getElementById('backupBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Backing up...</span>';

      try {
        showToast('Collecting all files...', 'info', 3000);

        const allFiles = await listAllFilesRecursive('');

        if (allFiles.length === 0) {
          showToast('Bucket is empty – nothing to backup', 'warning');
          return;
        }

        showToast(`Found ${allFiles.length} file(s). Downloading fresh copies...`, 'info', 4000);

        const zip = new JSZip();
        const hashParts = [];

        let processed = 0;
        for (const filePath of allFiles) {
          try {
            // Create a short-lived signed URL
            const { data: signed, error: signErr } = await supabaseClient
              .storage
              .from(currentBucket)
              .createSignedUrl(filePath, 60);

            if (signErr) throw signErr;

            // Force no-cache fetch so we always get the latest version
            const res = await fetch(signed.signedUrl, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const arrayBuffer = await res.arrayBuffer();
            zip.file(filePath, arrayBuffer);

            hashParts.push({
              path: filePath,
              buffer: arrayBuffer
            });
          } catch (err) {
            console.error('Failed to download', filePath, err);
            showToast(`Skipped ${filePath}`, 'warning', 2000);
          }

          processed++;
          if (processed % 5 === 0 || processed === allFiles.length) {
            showToast(`Downloaded ${processed} / ${allFiles.length}`, 'info', 1200);
          }
        }

        // Deterministic hash of path + binary content
        hashParts.sort((a, b) => a.path.localeCompare(b.path));

        const encoder = new TextEncoder();
        const chunks = [];
        let totalLength = 0;

        for (const part of hashParts) {
          const pathBytes = encoder.encode(part.path);
          const contentBytes = new Uint8Array(part.buffer);

          chunks.push(pathBytes);
          chunks.push(new Uint8Array([0]));
          chunks.push(contentBytes);

          totalLength += pathBytes.length + 1 + contentBytes.length;
        }

        const combined = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of chunks) {
          combined.set(chunk, offset);
          offset += chunk.length;
        }

        const hashBuffer = await crypto.subtle.digest('SHA-256', combined);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const fullHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        const shortHash = fullHash.slice(0, 16);

        const today = new Date().toISOString().slice(0, 10);
        const zipName = `${currentBucket}_${today}_${shortHash}.zip`;

        showToast('Creating ZIP...', 'info', 2000);
        const blob = await zip.generateAsync({
          type: 'blob',
          compression: 'DEFLATE',
          compressionOptions: { level: 6 }
        });

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = zipName;
        a.click();
        URL.revokeObjectURL(a.href);

        showToast(`Backup ready: ${zipName}`, 'success', 6000);
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Backup failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-box-archive"></i> <span>Backup</span>';
      }
    }

    async function listAllFilesRecursive(prefix = '') {
      const results = [];
      const { data, error } = await supabaseClient
        .storage
        .from(currentBucket)
        .list(prefix, { limit: 1000, offset: 0 });

      if (error) throw error;

      for (const item of (data || [])) {
        if (item.name === '.emptyFolderPlaceholder') continue;

        const fullPath = prefix ? `${prefix}/${item.name}` : item.name;

        if (!item.id) {
          const subFiles = await listAllFilesRecursive(fullPath);
          results.push(...subFiles);
        } else {
          results.push(fullPath);
        }
      }
      return results;
    }

    // ---------- Delete ----------
    async function deleteItem(path, isFolder) {
      if (!confirm(isFolder
        ? `Delete folder "${path}" and all its contents?`
        : `Delete file "${path}"?`)) return;

      try {
        if (isFolder) {
          const { data: files, error: listError } = await supabaseClient
            .storage
            .from(currentBucket)
            .list(path, { limit: 1000 });

          if (listError) throw listError;

          const pathsToDelete = [];
          if (files && files.length > 0) {
            for (const f of files) {
              pathsToDelete.push(`${path}/${f.name}`);
            }
          }
          pathsToDelete.push(`${path}/.emptyFolderPlaceholder`);

          if (pathsToDelete.length > 0) {
            const { error } = await supabaseClient
              .storage
              .from(currentBucket)
              .remove(pathsToDelete);
            if (error) throw error;
          }
        } else {
          const { error } = await supabaseClient
            .storage
            .from(currentBucket)
            .remove([path]);
          if (error) throw error;
        }

        showToast('Deleted successfully', 'success');
        listFiles();
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Delete failed', 'error');
      }
    }

    // ---------- Helpers ----------
    function isImage(name) {
      const e = getExtension(name).toLowerCase();
      return ['png','jpg','jpeg','gif','webp','svg','bmp','ico'].includes(e);
    }

    function isVideo(name) {
      const e = getExtension(name).toLowerCase();
      return ['mp4','webm','mov','avi','mkv','ogg'].includes(e);
    }

    function isAudio(name) {
      const e = getExtension(name).toLowerCase();
      return ['mp3','wav','ogg','m4a','flac','aac'].includes(e);
    }

    function isText(name) {
      const e = getExtension(name).toLowerCase();
      return ['txt','md','json','js','ts','html','css','xml','csv','log','py','sql','yml','yaml'].includes(e);
    }

    function updateConnectionStatus(connected, message) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      text.textContent = message;
      if (connected === true) dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      else if (connected === false) dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      else dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
    }

    function showToast(message, type = 'info', duration = 4000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      let bg = 'bg-slate-800 border-slate-700 text-slate-100';
      let icon = '<i class="fa-solid fa-circle-info text-sky-400 text-base mr-3"></i>';
      let accent = 'border-l-4 border-l-sky-500';

      if (type === 'success') {
        bg = 'bg-slate-900 border-emerald-800 text-emerald-100';
        icon = '<i class="fa-solid fa-circle-check text-emerald-400 text-base mr-3"></i>';
        accent = 'border-l-4 border-l-emerald-500';
      } else if (type === 'error') {
        bg = 'bg-slate-900 border-rose-800 text-rose-100';
        icon = '<i class="fa-solid fa-circle-exclamation text-rose-400 text-base mr-3"></i>';
        accent = 'border-l-4 border-l-rose-500';
      } else if (type === 'warning') {
        bg = 'bg-slate-900 border-amber-800 text-amber-100';
        icon = '<i class="fa-solid fa-triangle-exclamation text-amber-400 text-base mr-3"></i>';
        accent = 'border-l-4 border-l-amber-500';
      }

      toast.className = `pointer-events-auto flex items-center justify-between p-3.5 rounded-xl border shadow-xl ${bg} ${accent} transform transition-all duration-300 translate-x-12 opacity-0 text-xs font-medium`;
      toast.innerHTML = `
        <div class="flex items-center">${icon}<span>${escapeHtml(message)}</span></div>
        <button onclick="this.parentElement.remove()" class="ml-4 text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-x-12', 'opacity-0'));
      if (duration > 0) {
        setTimeout(() => {
          toast.classList.add('translate-x-12', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, duration);
      }
    }

    function closeModals() {
      document.querySelectorAll('.fixed').forEach(m => {
        if (m.id !== 'toastContainer') m.classList.add('hidden');
      });
      isTextEditor = false;
      document.getElementById('previewSaveBtn')?.classList.add('hidden');
      document.getElementById('previewCancelEditBtn')?.classList.add('hidden');
    }

    function switchTab(tab) {
      const viewExp = document.getElementById('viewExplorer');
      const viewSet = document.getElementById('viewSettings');
      const tabExp = document.getElementById('navExplorerTab');
      const tabSet = document.getElementById('navSettingsTab');

      if (tab === 'explorer') {
        viewExp.classList.remove('hidden');
        viewSet.classList.add('hidden');
        tabExp.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm text-slate-800 transition";
        tabSet.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition";
      } else {
        viewExp.classList.add('hidden');
        viewSet.classList.remove('hidden');
        tabSet.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm text-slate-800 transition";
        tabExp.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition";
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getExtension(name) {
      const parts = name.split('.');
      return parts.length > 1 ? parts.pop() : 'File';
    }

    function getFileIcon(name) {
      const e = getExtension(name).toLowerCase();
      if (['txt','md','log'].includes(e)) return '<i class="fa-solid fa-file-lines"></i>';
      if (['json','js','ts','html','css','py','java','sql'].includes(e)) return '<i class="fa-solid fa-file-code"></i>';
      if (['png','jpg','jpeg','gif','webp','svg'].includes(e)) return '<i class="fa-solid fa-file-image"></i>';
      if (['mp3','wav','ogg'].includes(e)) return '<i class="fa-solid fa-file-audio"></i>';
      if (['mp4','webm','mov'].includes(e)) return '<i class="fa-solid fa-file-video"></i>';
      if (['pdf'].includes(e)) return '<i class="fa-solid fa-file-pdf"></i>';
      if (['zip','rar','7z'].includes(e)) return '<i class="fa-solid fa-file-zipper"></i>';
      return '<i class="fa-solid fa-file"></i>';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
